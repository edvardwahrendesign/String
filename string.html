<canvas id="c" style="width:100%;height:100%;display:block;touch-action:none"></canvas>
<script>
const STRING_COLOR = '#ffb347', BG = '#14110f', WIDTH = 4;
const N = 160;            // points along the string
const TENSION = 0.3;      // wave speed (keep below 1)
const DAMPING = 0.003;    // how fast it fades
const SUBSTEPS = 4;

const c = document.getElementById('c'), ctx = c.getContext('2d');
const y = new Float32Array(N), v = new Float32Array(N);

function resize() {
  const r = devicePixelRatio || 1;
  c.width = c.clientWidth * r;
  c.height = c.clientHeight * r;
}
addEventListener('resize', resize); resize();

function pluck(px) {
  const idx = Math.round((px / c.clientWidth) * (N - 1));
  for (let i = 1; i < N - 1; i++) {
    const d = i - idx;
    y[i] += Math.exp(-(d * d) / 20);   // smooth bump at the press point
  }
}
c.addEventListener('pointerdown', e => {
  const rect = c.getBoundingClientRect();
  pluck(e.clientX - rect.left);
});

function step() {
  for (let i = 1; i < N - 1; i++) {
    v[i] += TENSION * (y[i - 1] + y[i + 1] - 2 * y[i]) - DAMPING * v[i];
  }
  for (let i = 1; i < N - 1; i++) y[i] += v[i];   // ends stay pinned at 0
}

function draw() {
  const w = c.width, h = c.height, amp = h * 0.18;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = STRING_COLOR; ctx.lineWidth = WIDTH * (devicePixelRatio || 1);
  ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const px = (i / (N - 1)) * w, py = h / 2 + y[i] * amp;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}

(function loop() {
  for (let s = 0; s < SUBSTEPS; s++) step();
  draw();
  requestAnimationFrame(loop);
})();
</script>
